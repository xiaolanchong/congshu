<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slovene Sentence Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <label><input type="checkbox" id="displayLearning" checked> Display SI</label>
    <label><input type="checkbox" id="displaySource" checked> Display RU/EN</label>
  </div>

  <main>
    <table>
      <thead>
        <tr>
          <th class="number-header">#</th>
          <th id="learningHeader">Learning</th>
          <th id="sourceHeader">Source</th>
        </tr>
      </thead>
      <tbody id="sentenceTableBody"></tbody>
    </table>
    <div id="error" class="error"></div>
  </main>

  <script src="script.js?v=2"></script>
</body>
</html>
